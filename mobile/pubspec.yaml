name: mobile
description: "Glow - Personalized Makeup Recommendation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Camera & ML (already in use by teammate) ────────────
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0

  # ── AI / Model Inference ────────────────────────────────
  #tflite_flutter: ^0.10.4
  image: ^4.1.7
  image_picker: ^1.0.7

  # ── Local Database (saved results) ──────────────────────
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # ── First-time user flag ────────────────────────────────
  shared_preferences: ^2.2.2

  # ── Permissions ─────────────────────────────────────────
  permission_handler: ^12.0.3

  # ── Feedback form link ──────────────────────────────────
  url_launcher: ^6.2.5
  face_detection_tflite: ^6.6.3
  opencv_dart: 2.2.1+4
  tflite_flutter: ^0.12.1
  dartcv4: 2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/makeup_styles/
  - assets/test/sample_face.jpg
  - assets/face_shape_model.tflite
  - assets/face_shape_model_labels.txt
  - assets/recommendations.json 