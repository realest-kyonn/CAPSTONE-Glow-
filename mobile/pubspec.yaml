name: mobile
description: "Glow - Personalized Makeup Recommendation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Camera & ML (already in use by teammate) ────────────
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0

  # ── AI / Model Inference ────────────────────────────────
  image: ^4.1.7
  image_picker: ^1.0.7

  # ── Local Database (saved results) ──────────────────────
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # ── First-time user flag ────────────────────────────────
  shared_preferences: ^2.2.2

  # ── Permissions ─────────────────────────────────────────
  permission_handler: ^12.0.3

  # ── Feedback form link ──────────────────────────────────
  url_launcher: ^6.2.5
  face_detection_tflite: ^6.6.3
  opencv_dart: 2.2.1+4
  tflite_flutter: ^0.12.1
  dartcv4: 2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jfif"

flutter:
  uses-material-design: true

  assets:
    - assets/makeup_styles/
    - assets/makeup_steps/clean_girl_makeup/
    - assets/makeup_steps/corporate_clean_makeup/
    - assets/makeup_steps/douyin_natural_makeup/
    - assets/makeup_steps/igari_inspired_makeup/
    - assets/makeup_steps/korean_daily_makeup/
    - assets/makeup_steps/lifted_makeup/
    - assets/makeup_steps/neutral_glam_makeup/
    - assets/makeup_steps/no_makeup_makeup/
    - assets/makeup_steps/office_makeup/
    - assets/makeup_steps/peach_makeup/
    - assets/makeup_steps/snatched_everyday_makeup/
    - assets/makeup_steps/soft_glam_everyday_makeup/
    - assets/makeup_steps/soft_contour_makeup/
    - assets/makeup_steps/strawberry_makeup/
    - assets/test/sample_face.jpg
    - assets/face_shape_model.tflite
    - assets/face_shape_model_labels.txt
    - assets/recommendations.json